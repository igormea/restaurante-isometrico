<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7a5233">
  <title>Restaurante Isométrico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-mode="play">
  <canvas id="game"></canvas>

  <!-- barra superior -->
  <header id="hud">
    <button id="hud-time" class="pill clock" aria-label="Abrir calendário">
      <b id="hud-clock">--:--</b>
      <span class="clock-txt"><small id="hud-date"></small><span id="hud-status" class="status">…</span></span>
    </button>
    <div class="pill-group">
      <div class="pill cash" title="Saldo em caixa"><b id="hud-cash">R$ 0</b></div>
      <div class="pill small" title="Reputação">⭐ <b id="hud-rep">3.0</b></div>
      <div class="pill small" title="Higiene">🧼 <b id="hud-hyg">100%</b></div>
      <div class="pill small" id="hud-plates-pill" title="Pratos limpos / sujos">🍽️ <b id="hud-plates">0</b></div>
      <div class="pill small" title="Beleza (atrai clientes)">💖 <b id="hud-charm">0</b></div>
    </div>
  </header>

  <div id="banner"></div>
  <div id="modebar"></div>

  <!-- zoom -->
  <div id="zoom">
    <button id="btn-zoom-in" aria-label="Aproximar">＋</button>
    <button id="btn-zoom-out" aria-label="Afastar">－</button>
    <button id="btn-center" aria-label="Centralizar">◎</button>
  </div>

  <!-- barra inferior -->
  <nav id="toolbar">
    <button id="btn-staff" class="tool"><span>👥</span>Equipe</button>
    <button id="btn-menu" class="tool"><span>📋</span>Cardápio</button>
    <button id="btn-stock" class="tool"><span>📦</span>Estoque</button>
    <button id="btn-finance" class="tool"><span>💰</span>Finanças</button>
    <button id="btn-shop" class="tool primary"><span>🛒</span>Loja</button>
    <button id="btn-more" class="tool"><span>☰</span>Mais</button>
  </nav>

  <div id="modal-bg"><div id="modal" class="modal"></div></div>
  <div id="toasts"></div>
  <div id="loading">Abrindo o restaurante…</div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
